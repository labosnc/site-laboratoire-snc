# Présentation d'Édith Durand (source : CV commun, novembre 2026)
fr:
  role: Professeure adjointe au Département d’orthophonie de l’Université du Québec à Trois-Rivières depuis 2022 et directrice du laboratoire SNC. Titulaire d’une chaire de recherche Émergence de l’UQTR sur les liens entre sensorimotricité et langage.
  interests: "Ses recherches portent sur les liens entre sensorimotricité et langage ou parole, avec une question centrale : comment le système sensorimoteur contribue-t-il au développement et à la récupération du langage et de la parole ? Elle combine des approches comportementales et la neuroimagerie structurelle et fonctionnelle pour développer des thérapies orthophoniques qui exploitent ces liens."
  keywords: cognition incarnée et située, aphasie et anomie, thérapie POEM, gestes co-verbaux, plasticité cérébrale, vieillissement du langage
  education_title: Parcours
  education:
    - "Ph. D. en sciences biomédicales, option orthophonie, Université de Montréal (2020)"
    - "Maîtrise professionnelle en orthophonie, Université de Montréal (2011)"
    - "Certificat de capacité d’orthophoniste, Université de Franche-Comté, France (2005)"
    - "Orthophoniste en clinique et en réadaptation en France et au Québec (2005-2013)"
  awards_title: Distinctions
  awards:
    - "Liste d’honneur du doyen, doctorat en sciences biomédicales, Université de Montréal (2020)"
    - "Prix Mentorat, École d’orthophonie et d’audiologie, Université de Montréal (2015 et 2019)"
    - "Prix Rayonnement, École d’orthophonie et d’audiologie, Université de Montréal (2015)"
    - "Prix Michèle-Bergeron, Université de Montréal (2012)"
  cv: Télécharger le CV (PDF)
en:
  role: Assistant Professor in the Department of Speech-Language Pathology at the Université du Québec à Trois-Rivières since 2022 and director of the SNC lab. Holder of a UQTR Emergence research chair on the links between sensorimotor processes and language.
  interests: "Her research examines the links between sensorimotor processes and language or speech, around one central question: how does the sensorimotor system contribute to the development and recovery of language and speech? She combines behavioural methods with structural and functional neuroimaging to develop speech-language therapies that build on these links."
  keywords: embodied and situated cognition, aphasia and anomia, POEM therapy, co-speech gestures, brain plasticity, language in ageing
  education_title: Background
  education:
    - "PhD in Biomedical Sciences, Speech-Language Pathology option, Université de Montréal (2020)"
    - "Professional Master’s in Speech-Language Pathology, Université de Montréal (2011)"
    - "Certificate of Competence in Speech-Language Pathology, Université de Franche-Comté, France (2005)"
    - "Speech-language pathologist in clinical and rehabilitation settings in France and Quebec (2005-2013)"
  awards_title: Awards
  awards:
    - "Dean’s Honour List, PhD in Biomedical Sciences, Université de Montréal (2020)"
    - "Mentorship Award, School of Speech-Language Pathology and Audiology, Université de Montréal (2015 and 2019)"
    - "Outreach Award, School of Speech-Language Pathology and Audiology, Université de Montréal (2015)"
    - "Michèle-Bergeron Award, Université de Montréal (2012)"
