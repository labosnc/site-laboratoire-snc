# Ressources et outils, présentés en cartes.
# Champs : title, credit ; fr/en { kind, description } ; optionnel : url
- title: Manuel de référence pour la transcription, le codage et l’analyse dans CLAN des corpus francophones du MACS
  credit: Zumbansen, Anglade et Durand (2022), Pressbooks
  fr:
    kind: Manuel
    description: Guide pas à pas pour transcrire, coder et analyser des corpus de discours francophones avec le logiciel CLAN.
  en:
    kind: Manual
    description: A step-by-step guide (in French) to transcribing, coding and analysing French-language discourse corpora with the CLAN software.

- title: 237 photographies normalisées pour la dénomination
  credit: Lefebvre, Turcotte, Ferrand et Durand (2026), Journal of Cognition
  url: https://doi.org/10.5334/joc.509
  fr:
    kind: Banque d’images
    description: Ensemble de photographies avec normes d’accord sur le nom, établies auprès de locuteurs francophones du Québec et de France, pour l’évaluation et l’intervention en orthophonie.
  en:
    kind: Image set
    description: Photographs with name-agreement norms collected from French speakers in Quebec and France, for assessment and therapy in speech-language pathology.

- title: Assessment of co-speech gestures in adults
  credit: Durand, Boulenger, Marcotte, Brambati et Ruest (2026), PROSPERO CRD420261326429
  url: https://www.crd.york.ac.uk/PROSPERO/view/CRD420261326429
  fr:
    kind: Protocole de revue systématique
    description: Protocole enregistré d’une revue systématique des méthodes d’évaluation des gestes co-verbaux chez l’adulte.
  en:
    kind: Systematic review protocol
    description: Registered protocol for a systematic review of how co-speech gestures are assessed in adults.

- title: Optimal testing situations for the automated analysis of cognitive components in natural language
  credit: Vantwembeke, Durand, Lefebvre et Invernizzi (2025), PROSPERO CRD420251131954
  url: https://www.crd.york.ac.uk/PROSPERO/view/CRD420251131954
  fr:
    kind: Protocole de revue systématique
    description: Protocole enregistré d’une revue systématique sur les situations de test les plus adaptées à l’analyse automatisée du langage naturel.
  en:
    kind: Systematic review protocol
    description: Registered protocol for a systematic review of the testing situations best suited to the automated analysis of natural language.

